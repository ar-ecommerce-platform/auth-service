---
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # dev only - lets the browser reach the in-container console

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    # Dev-only fallback. Real value is injected from the environment (see infra/compose/.env).
    # HS256 needs >= 32 bytes.
    secret: ${JWT_SECRET:dev-only-not-a-real-secret-change-me-0000000000000000}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:ecommerce-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
